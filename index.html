        },
        { text: "Durante una actualización de firmware (flashing), ocurre una fluctuación de voltaje que interrumpe el proceso al 60%. ¿Por qué el sistema se vuelve un 'ladrillo' (bricked) incapaz de ejecutar el POST?",
          options: ["Porque el Sistema Operativo (Capa 4) bloquea el acceso al hardware por seguridad.", "Porque el código en la EEPROM queda a medias, eliminando las rutinas básicas de inicialización de hardware.", "Porque el Secure Boot detecta una firma digital incompleta y detiene el procesador.", "Porque el chip EEPROM requiere energía constante para mantener su naturaleza de memoria no volátil.", "Porque los parámetros de overclocking se borran permanentemente de la memoria RAM."],

        },
        { text: "Un técnico intenta instalar un disco duro de 4 TB en un sistema antiguo con BIOS tradicional. El sistema solo reconoce 2 TB. ¿Cuál es el límite técnico que causa este comportamiento?",
          options: ["El BIOS tradicional no admite rutinas de servicio de entrada/salida para periféricos modernos.", "El límite de almacenamiento del BIOS tradicional está restringido a un máximo de 2 TB por diseño.", "El proceso POST se detiene al detectar dispositivos de almacenamiento de alta densidad.", "La EEPROM del sistema antiguo no tiene suficientes ciclos de vida para gestionar tablas de particiones grandes.", "El módulo CSM (Compatibility Support Module) está desactivado por defecto."],

        { text: "Un servidor de alta disponibilidad reporta errores de suma de comprobación (checksum) frecuentes en su firmware. El análisis revela que el chip EEPROM ha superado los 100,000 ciclos. ¿Qué medida de mitigación debería haberse implementado para maximizar su vida útil?",
          options: ["Reducir la temperatura ambiente para evitar la degradación acelerada.", "Utilizar un entorno gráfico (GUI) para reducir la carga en la EEPROM.", "Implementar gestión avanzada de errores y nivelación de desgaste (wear-leveling).", "Sustituir el chip EEPROM por una memoria volátil de alta velocidad.", "Desactivar el Secure Boot para reducir las escrituras de seguridad."],

        { text: "¿Cuál es la diferencia crítica en el proceso de 'Paso 3: El Relevo al Sistema Operativo' entre un BIOS tradicional y UEFI?",

          options: ["En la memoria RAM principal para acceso rápido durante el POST.", "En el Kernel del Sistema Operativo (Capa 4).", "En el chip EEPROM junto con el BIOS y los parámetros esenciales.", "En el sector de arranque del dispositivo de almacenamiento prioritario.", "En el controlador de interrupciones de la Capa 3."],

        { text: "Un técnico sospecha que la EEPROM está fallando debido a factores de estrés externos. Según el material, ¿qué combinación de factores acelera el deterioro físico del chip?",
          options: ["Uso excesivo del mouse en la interfaz UEFI y fragmentación del disco duro.", "Temperaturas ambientales elevadas y fluctuaciones de voltaje.", "Actualizaciones frecuentes del Sistema Operativo y errores en el sector de arranque.", "Incompatibilidad con Secure Boot y uso de discos duros superiores a 2 TB.", "Ejecución prolongada del POST y fallos en el test de memoria RAM."],
          correct: "b",
          explanation: "Correcta (b): El material identifica explícitamente la temperatura ambiente y las fluctuaciones de voltaje como factores de estrés que aceleran la degradación de la EEPROM."

        { text: "¿Por qué se considera que el flasheo del BIOS se realiza en un 'entorno seguro' si se hace desde la herramienta integrada en la UEFI (ej. EZ Flash) en lugar de desde el Sistema Operativo?",

          explanation: "Correcta (b): El protocolo de actualización segura recomienda flashear desde la UEFI para evitar hacerlo desde el Sistema Operativo, minimizando riesgos de interrupción."

        { text: "¿Cuál es el propósito final del proceso POST antes de permitir que el sistema avance a la siguiente fase?",

    const liveScoreSpan = document.getElementById('liveScore');
    const resultsPanel = document.getElementById('resultsPanel');

    const tonos = ['tono-1', 'tono-2', 'tono-3', 'tono-4', 'tono-5', 'tono-6', 'tono-7', 'tono-8', 'tono-9', 'tono-10'];

    function updateLiveScore() {
        let correctCount = 0;
        for (let i = 0; i < userAnswers.length; i++) {
            if (userAnswers[i] && userAnswers[i] === questionsData[i].correct) correctCount++;
        }
        liveScoreSpan.textContent = `✅ Aciertos: ${correctCount} / 20`;
        return correctCount;
    }

    function saveAnswer(selectedLetter) {
        userAnswers[currentIndex] = selectedLetter;
        updateLiveScore();
        renderCurrentQuestion();
    }

    function renderCurrentQuestion() {
        const q = questionsData[currentIndex];
        const selected = userAnswers[currentIndex];
        const letters = ['a', 'b', 'c', 'd', 'e'];
        let optionsHtml = '';
        q.options.forEach((opt, idx) => {
            const letter = letters[idx];
            const isChecked = (selected === letter);
            optionsHtml += `
                <div class="option" data-letter="${letter}">
                    <input type="radio" name="question" value="${letter}" id="opt_${letter}" ${isChecked ? 'checked' : ''}>
                    <label for="opt_${letter}"><strong>${letter.toUpperCase()})</strong> ${opt}</label>
                </div>
            `;
        });

        let feedbackHtml = '';
        if (selected) {
            const isCorrect = (selected === q.correct);
            const correctLetter = q.correct;
            const correctText = q.options[letters.indexOf(correctLetter)];
            const explanation = q.explanation;
            if (isCorrect) {
                feedbackHtml = `<div class="feedback correct">✅ <strong>¡Correcto!</strong> ${explanation}</div>`;
            } else {
                feedbackHtml = `<div class="feedback incorrect">❌ <strong>Incorrecto.</strong> La respuesta correcta es ${correctLetter.toUpperCase()}) ${correctText}.<br>${explanation}</div>`;
            }
        } else {
            feedbackHtml = `<div class="feedback" style="border-left-color:#ffcc88; background:#fff5e6;">⚡ Selecciona una opción para ver la retroalimentación.</div>`;
        }

        const tonoClass = tonos[currentIndex % tonos.length];

        const html = `
            <div class="question-card ${tonoClass}">
                <div class="question-text">${q.text}</div>
                <div class="options" id="optionsContainer">
                    ${optionsHtml}
                </div>
                ${feedbackHtml}
            </div>
        `;
        questionContainer.innerHTML = html;

        const optionDivs = document.querySelectorAll('.option');
        optionDivs.forEach(div => {
            const radio = div.querySelector('input[type="radio"]');
            const letter = div.getAttribute('data-letter');
            if (radio) {
                radio.addEventListener('change', () => {
                    if (radio.checked) saveAnswer(letter);
                });
            }
            div.addEventListener('click', (e) => {
                if (e.target.tagName !== 'INPUT') {
                    const radioInside = div.querySelector('input');
                    if (radioInside && !radioInside.checked) {
                        radioInside.checked = true;
                        saveAnswer(letter);
                    }
                }
            });
        });

        questionCounterSpan.textContent = `Pregunta ${currentIndex+1} / 20`;
    }

    function showFinalResults() {
        let correctCount = 0;
        let detailsHtml = '';
        for (let i = 0; i < questionsData.length; i++) {
            const q = questionsData[i];
            const userAns = userAnswers[i];
            const isCorrect = (userAns === q.correct);
            if (isCorrect) correctCount++;
            const statusIcon = isCorrect ? '✅' : '❌';
            const userShow = userAns ? userAns.toUpperCase() : '—';
            const correctShow = q.correct.toUpperCase();
            detailsHtml += `
                <div class="result-item">
                    <span style="min-width: 30px;">${statusIcon}</span>
                    <span><strong>Pregunta ${i+1}</strong> (Tu respuesta: ${userShow} / Correcta: ${correctShow})</span>
                </div>
            `;
        }
        const percent = Math.round((correctCount / 20) * 100);
        resultsPanel.innerHTML = `
            <h3>📊 Resultado final</h3>
            <div class="result-summary">🎯 Aciertos: ${correctCount} de 20 (${percent}%)</div>
            <div class="result-detail">${detailsHtml}</div>
            <button id="closeResultsBtn" class="btn btn-secondary" style="margin-top: 10px; width:100%;">✖ Cerrar resumen</button>
        `;
        resultsPanel.style.display = 'block';
        document.getElementById('closeResultsBtn')?.addEventListener('click', () => {
            resultsPanel.style.display = 'none';
        });
        alert(`📊 Cuestionario completado.\nAciertos: ${correctCount} de 20 (${percent}%)\nRevisa el resumen detallado en pantalla.`);
    }

    function nextQuestion() {
        if (currentIndex < 19) {
            currentIndex++;
            renderCurrentQuestion();
        } else {
            const unanswered = userAnswers.filter(a => a === null).length;
            if (unanswered > 0) {
                if (confirm(`Aún tienes ${unanswered} pregunta(s) sin responder. ¿Deseas finalizar de todas formas? Las no respondidas se contarán como incorrectas.`)) {
                    showFinalResults();
                }
            } else {
                showFinalResults();
            }
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            renderCurrentQuestion();
        } else {
            alert("Ya estás en la primera pregunta.");
        }
    }

    function resetQuiz() {
        if (confirm("¿Reiniciar todo el cuestionario? Se perderán todas las respuestas.")) {
            userAnswers = new Array(20).fill(null);
            currentIndex = 0;
            resultsPanel.style.display = 'none';
            updateLiveScore();
            renderCurrentQuestion();
        }
    }

    prevBtn.addEventListener('click', prevQuestion);
    nextBtn.addEventListener('click', nextQuestion);
    resetBtn.addEventListener('click', resetQuiz);
    finalScoreBtn.addEventListener('click', showFinalResults);

    renderCurrentQuestion();
    updateLiveScore();
</script>
</body>
</html>
